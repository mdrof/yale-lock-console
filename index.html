<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yale YMH70A 诊断台</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --line:#252a34; --text:#e6e9ef;
    --muted:#8b93a1; --accent:#4f9dff; --ok:#3ddc84; --err:#ff5c5c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
    padding:16px 14px 40px;max-width:560px;margin:0 auto}
  h1{font-size:18px;margin:4px 0 2px;font-weight:600}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  input{width:100%;background:#0c0e12;border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:11px 12px;font:13px/1.4 ui-monospace,Menlo,monospace}
  button{appearance:none;border:none;border-radius:12px;padding:14px 16px;font-size:15px;
    font-weight:600;color:#0b0d11;background:var(--accent);width:100%;margin-top:10px}
  button:active{opacity:.7} button:disabled{opacity:.35}
  button.ghost{background:#232936;color:var(--text)}
  button.small{padding:11px;font-size:13px;margin-top:8px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 button{margin-top:0}
  .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#4a5160}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #log{font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;
    max-height:340px;overflow:auto;margin:0;color:#b9c2d0}
  .logline{padding:3px 0;border-bottom:1px solid #1d222b}
  .t{color:#5d6675;margin-right:6px}
  .send{color:var(--accent)} .recv{color:var(--ok)} .errline{color:var(--err)}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
  code{background:#0c0e12;padding:1px 5px;border-radius:5px;font-size:12px}
  details{margin-top:12px}
  summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
  .row{display:flex;gap:10px;align-items:center}
  .res{font:12px/1.7 ui-monospace,Menlo,monospace;margin-top:10px}
  .res div{padding:5px 9px;border-radius:6px;margin-bottom:5px;background:#0c0e12}
  .hit{background:#12301f !important;color:var(--ok)}
</style>
</head>
<body>

<h1>Yale YMH70A 诊断台</h1>
<div class="sub">Web Bluetooth · 本地直连</div>

<div class="card">
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">未连接</span></div>
  <button id="btnConnect">连接门锁</button>
</div>

<div class="card">
  <label>一键检测</label>
  <button id="btnAuto">开始自动检测</button>
  <div class="hint">
    自动完成：枚举服务 → 读 HAP 标识 → 逐个尝试 5 个候选密钥做加密握手 → 汇总
  </div>
  <div class="res" id="result"></div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <label style="margin:0">日志</label>
    <button id="btnCopyLog" class="ghost small" style="width:auto;margin:0;padding:6px 14px;font-size:12px">复制</button>
  </div>
  <div id="log" style="margin-top:10px"></div>
</div>

<details>
<summary>手动工具（点开）</summary>

<div class="card" style="margin-top:10px">
  <label>单个密钥握手试探</label>
  <input id="hsKey" value="00000000000000000000000000000000" spellcheck="false">
  <div class="row" style="margin-top:10px">
    <div style="flex:1"><label>槽位</label><input id="hsSlot" value="1" inputmode="numeric"></div>
  </div>
  <button id="btnHs" class="ghost small">发送 SendMobileKey</button>
</div>

<div class="card">
  <label>自定义帧（十六进制）</label>
  <input id="customFrame" value="41 00 00 00 00 00 00 00 00 00 00 00 BF FF FF FF 0F 00" spellcheck="false">
  <div class="grid2" style="margin-top:10px">
    <button id="btnSendPlain" class="ghost small">发到 611</button>
    <button id="btnSendSec" class="ghost small">发到 613</button>
  </div>
</div>

<div class="card">
  <label>其他</label>
  <button id="btnEnum" class="ghost small">枚举 GATT</button>
  <button id="btnHap" class="ghost small">读 HAP 状态</button>
  <button id="btnOta" class="ghost small">测 OTA 通道</button>
  <button id="btnHkReset" class="ghost small">HomeKit_Reset (0x2E)</button>
</div>

</details>

<script>
const SVC_AUGUST = '0000fe24-0000-1000-8000-00805f9b34fb';
const C_WRITE = 'bd4ac611-0b45-11e3-8ffd-0800200c9a66';
const C_READ  = 'bd4ac612-0b45-11e3-8ffd-0800200c9a66';
const C_SEC_W = 'bd4ac613-0b45-11e3-8ffd-0800200c9a66';
const C_SEC_R = 'bd4ac614-0b45-11e3-8ffd-0800200c9a66';
const C_OTA_C = 'bd4ac615-0b45-11e3-8ffd-0800200c9a66';
const C_OTA_D = 'bd4ac616-0b45-11e3-8ffd-0800200c9a66';

const ENUM_SERVICES = [
  SVC_AUGUST,
  '00001800-0000-1000-8000-00805f9b34fb',
  '00001801-0000-1000-8000-00805f9b34fb',
  '0000180a-0000-1000-8000-00805f9b34fb',
  '0000180f-0000-1000-8000-00805f9b34fb',
  '00000055-0000-1000-8000-0026bb765291',
  '0000003e-0000-1000-8000-0026bb765291',
  '00000044-0000-1000-8000-0026bb765291',
  '0000004a-0000-1000-8000-0026bb765291',
  '000000a3-0000-1000-8000-0026bb765291'
];

const CANDIDATES = [
  ['全零',         '00000000000000000000000000000000'],
  ['全 FF',        'ffffffffffffffffffffffffffffffff'],
  ['配对码 ASCII',  '32333230363236340000000000000000'],
  ['8 个 0 ASCII',  '30303030303030300000000000000000'],
  ['测试密钥',      '00112233445566778899aabbccddeeff']
];

let device = null;
let writeChar = null, notifyChar = null, secWriteChar = null, secNotifyChar = null;
let otaCmdChar = null;
let listenerBound = false;
let lastNotify = null;

const $ = id => document.getElementById(id);
const logEl = $('log');

function log(text, cls) {
  const t = new Date().toLocaleTimeString('zh-CN', {hour12:false});
  const d = document.createElement('div');
  d.className = 'logline';
  d.innerHTML = '<span class="t">' + t + '</span><span class="' + (cls||'') + '">' + text + '</span>';
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}

const hex = u8 => Array.from(u8, b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
const fromHex = s => {
  const c = s.replace(/[^0-9a-fA-F]/g,'');
  if (c.length % 2) throw new Error('hex 长度必须是偶数');
  const o = new Uint8Array(c.length/2);
  for (let i=0;i<o.length;i++) o[i] = parseInt(c.substr(i*2,2),16);
  return o;
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand32 = () => Math.floor(Math.random()*0x100000000) >>> 0;

function secFrame(op, w1, w2, slot) {
  const f = new Uint8Array(18);
  const dv = new DataView(f.buffer);
  dv.setUint32(0, op>>>0, true);
  dv.setUint32(4, w1>>>0, true);
  dv.setUint32(8, w2>>>0, true);
  const s = (dv.getUint32(0,true)+dv.getUint32(4,true)+dv.getUint32(8,true))>>>0;
  dv.setUint32(12, ((~s)+1)>>>0, true);
  f[16] = 0x0F; f[17] = slot & 0xFF;
  return f;
}
function plainFrame(op) {
  const f = new Uint8Array(18);
  f[0]=0xEE; f[1]=op; f[16]=0x02;
  let s=0; for(let i=0;i<18;i++) s=(s+f[i])&0xFF;
  f[3]=(0-s)&0xFF;
  return f;
}
async function aesEnc16(key, plain16) {
  const k = await crypto.subtle.importKey('raw', key, {name:'AES-CBC'}, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt({name:'AES-CBC', iv:new Uint8Array(16)}, k, plain16);
  return new Uint8Array(ct).slice(0,16);
}

function setConnected(on, name) {
  $('dot').classList.toggle('on', on);
  $('statusText').textContent = on ? ('已连接 ' + (name||'')) : '未连接';
  $('btnConnect').textContent = on ? '断开' : '连接门锁';
}

async function setupChars() {
  const svc = await device.gatt.getPrimaryService(SVC_AUGUST);
  writeChar = await svc.getCharacteristic(C_WRITE);
  notifyChar = await svc.getCharacteristic(C_READ);
  secWriteChar = await svc.getCharacteristic(C_SEC_W);
  secNotifyChar = await svc.getCharacteristic(C_SEC_R);

  await notifyChar.startNotifications();
  notifyChar.addEventListener('characteristicvaluechanged', e => {
    const h = hex(new Uint8Array(e.target.value.buffer));
    lastNotify = h;
    log('← [明文] ' + h, 'recv');
  });
  await secNotifyChar.startNotifications();
  secNotifyChar.addEventListener('characteristicvaluechanged', e => {
    const h = hex(new Uint8Array(e.target.value.buffer));
    lastNotify = h;
    log('← [加密] ' + h, 'recv');
  });
  try {
    otaCmdChar = await svc.getCharacteristic(C_OTA_C);
    await otaCmdChar.startNotifications();
    otaCmdChar.addEventListener('characteristicvaluechanged', e => {
      log('← [OTA] ' + hex(new Uint8Array(e.target.value.buffer)), 'recv');
    });
  } catch (e) { otaCmdChar = null; }
}

async function ensureConnected() {
  if (device && device.gatt.connected) return true;
  if (!device) { log('请先点「连接门锁」', 'errline'); return false; }
  try {
    await device.gatt.connect();
    await setupChars();
    setConnected(true, device.name || '');
    return true;
  } catch (e) { log('重连失败：' + e.message, 'errline'); return false; }
}

async function connect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect(); setConnected(false); log('已断开'); return;
  }
  try {
    if (!device) {
      log('正在请求设备…');
      device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true, optionalServices: ENUM_SERVICES
      });
      if (!listenerBound) {
        device.addEventListener('gattserverdisconnected', function(){
          setConnected(false); log('连接已断开', 'errline');
        });
        listenerBound = true;
      }
      log('选中：' + (device.name || '(无名)'));
    }
    await device.gatt.connect();
    await setupChars();
    setConnected(true, device.name || '');
    log('已连接并订阅通知', 'recv');
  } catch (e) { log('连接失败：' + e.message, 'errline'); }
}

async function tryKey(keyHex, slot) {
  if (!await ensureConnected()) return { ok:false, why:'连接失败' };
  let key;
  try { key = fromHex(keyHex); } catch(e) { return { ok:false, why:'hex 错误' }; }
  if (key.length !== 16) return { ok:false, why:'密钥长度错' };
  lastNotify = null;
  const frame = secFrame(0x01, rand32(), rand32(), slot);
  const enc = await aesEnc16(key, frame.slice(0,16));
  const pkt = new Uint8Array(18);
  pkt.set(enc,0); pkt[16]=0x0F; pkt[17]=slot&0xFF;
  try { await secWriteChar.writeValueWithResponse(pkt); }
  catch (e) { return { ok:false, why:'写入失败' }; }
  await sleep(1200);
  if (lastNotify) return { ok:true, notify:lastNotify };
  return { ok:false, why: device.gatt.connected ? '无响应' : '断链' };
}

async function autoTest() {
  $('btnAuto').disabled = true;
  const rows = [];
  const add = function(k,v,hit){
    rows.push('<div class="' + (hit?'hit':'') + '">' + k + '：' + v + '</div>');
    $('result').innerHTML = rows.join('');
  };
  try {
    if (!await ensureConnected()) { add('连接','失败'); return; }
    add('连接','成功');

    const found = [];
    for (const u of ENUM_SERVICES) {
      try { await device.gatt.getPrimaryService(u); found.push(u.slice(0,8)); } catch(e){}
    }
    add('服务', found.join(' ') || '无');

    try {
      const s = await device.gatt.getPrimaryService('00000055-0000-1000-8000-0026bb765291');
      const c = await s.getCharacteristic('e604e95d-a759-4817-87d3-aa005083a0d1');
      const v = await c.readValue();
      add('HAP 标识', hex(new Uint8Array(v.buffer)));
    } catch (e) { add('HAP 标识','读不到'); }

    let hit = null;
    for (let i=0;i<CANDIDATES.length;i++) {
      const name = CANDIDATES[i][0], keyHex = CANDIDATES[i][1];
      const r = await tryKey(keyHex, 1);
      if (r.ok) { add('密钥「'+name+'」', '★ 命中，响应=' + r.notify, true); hit = name; break; }
      add('密钥「'+name+'」', r.why);
    }
    add('结论', hit ? ('密钥命中：' + hit) : '全部失败');
  } catch (e) {
    add('异常', e.message);
  } finally {
    $('btnAuto').disabled = false;
  }
}

async function enumerateAll() {
  if (!await ensureConnected()) return;
  log('=== 枚举 GATT ===');
  let n = 0;
  for (const u of ENUM_SERVICES) {
    try {
      const s = await device.gatt.getPrimaryService(u);
      n++;
      log('■ ' + u, 'recv');
      const cs = await s.getCharacteristics();
      for (const c of cs) {
        const p = [];
        if (c.properties.read) p.push('read');
        if (c.properties.write) p.push('write');
        if (c.properties.writeWithoutResponse) p.push('writeNR');
        if (c.properties.notify) p.push('notify');
        if (c.properties.indicate) p.push('indicate');
        log('    └ ' + c.uuid + ' [' + p.join(',') + ']');
      }
    } catch (e) {}
  }
  log('=== 命中 ' + n + ' 个服务 ===', 'recv');
}

async function readHap() {
  if (!await ensureConnected()) return;
  const list = [
    ['0000003e-0000-1000-8000-0026bb765291','00000020-0000-1000-8000-0026bb765291','HAP 版本'],
    ['0000003e-0000-1000-8000-0026bb765291','00000052-0000-1000-8000-0026bb765291','Accessory Flags'],
    ['00000055-0000-1000-8000-0026bb765291','0000004f-0000-1000-8000-0026bb765291','Pairing Features'],
    ['00000055-0000-1000-8000-0026bb765291','00000050-0000-1000-8000-0026bb765291','Pairings'],
    ['00000055-0000-1000-8000-0026bb765291','e604e95d-a759-4817-87d3-aa005083a0d1','未知@55'],
    ['00000044-0000-1000-8000-0026bb765291','00000019-0000-1000-8000-0026bb765291','Lock Control Point']
  ];
  for (let i=0;i<list.length;i++) {
    const su = list[i][0], cu = list[i][1], name = list[i][2];
    try {
      const s = await device.gatt.getPrimaryService(su);
      const c = await s.getCharacteristic(cu);
      const v = await c.readValue();
      log(name + ': ' + hex(new Uint8Array(v.buffer)), 'recv');
    } catch (e) { log(name + ': 读取失败', 'errline'); }
  }
}

async function testOta() {
  if (!await ensureConnected()) return;
  if (!otaCmdChar) { log('OTA 特征值不可用', 'errline'); return; }
  const f = plainFrame(0x14);
  await otaCmdChar.writeValueWithoutResponse(f);
  log('→ [OTA] ' + hex(f), 'send');
  await sleep(1500);
  log(device.gatt.connected ? '✔ OTA 后连接保持' : '✘ OTA 后断链',
      device.gatt.connected ? 'recv' : 'errline');
}

async function copyLog() {
  const t = Array.from(logEl.children).map(function(d){return d.textContent.trim();}).join('\n');
  if (!t) { log('日志为空'); return; }
  try { await navigator.clipboard.writeText(t); log('已复制', 'recv'); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    log('已复制', 'recv');
  }
}

$('btnConnect').onclick = connect;
$('btnAuto').onclick = autoTest;
$('btnCopyLog').onclick = copyLog;
$('btnEnum').onclick = enumerateAll;
$('btnHap').onclick = readHap;
$('btnOta').onclick = testOta;

$('btnHs').onclick = async function() {
  try {
    const r = await tryKey($('hsKey').value, parseInt($('hsSlot').value,10)||1);
    log(r.ok ? ('★ 命中，响应 ' + r.notify) : ('失败：' + r.why), r.ok?'recv':'errline');
  } catch (e) { log(e.message, 'errline'); }
};
$('btnSendPlain').onclick = async function() {
  try {
    const f = fromHex($('customFrame').value);
    if (await ensureConnected()) { await writeChar.writeValueWithResponse(f); log('→ ' + hex(f), 'send'); }
  } catch (e) { log(e.message, 'errline'); }
};
$('btnSendSec').onclick = async function() {
  try {
    const f = fromHex($('customFrame').value);
    if (await ensureConnected()) { await secWriteChar.writeValueWithResponse(f); log('→ ' + hex(f), 'send'); }
  } catch (e) { log(e.message, 'errline'); }
};
$('btnHkReset').onclick = async function() {
  if (!confirm('HomeKit_Reset 可能清掉 HomeKit 配对，继续？')) return;
  try {
    const f = plainFrame(0x2E);
    if (await ensureConnected()) {
      await writeChar.writeValueWithResponse(f);
      log('→ HomeKit_Reset ' + hex(f), 'send');
      await sleep(1500);
      log(device.gatt.connected ? '✔ 连接保持' : '✘ 断链', device.gatt.connected?'recv':'errline');
    }
  } catch (e) { log(e.message, 'errline'); }
};

if (!navigator.bluetooth) {
  log('此浏览器不支持 Web Bluetooth，请用 Android Chrome', 'errline');
  $('btnConnect').disabled = true;
}
</script>
</body>
</html>
